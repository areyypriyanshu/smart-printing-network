name: ${SPN_COMPOSE_PROJECT:-spn}

services:
  db:
    image: postgis/postgis:16-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spn}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spn} -d ${POSTGRES_DB:-spn}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MC_HOST_local: http://${S3_ACCESS_KEY:-spn}:${S3_SECRET_KEY}@localhost:9000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # A database browser for local development, the way phpMyAdmin or a
  # MySQL workbench shows tables and rows. It is a development tool: it
  # is not in docker-compose.prod.yml, and it sits behind the "tools"
  # profile so that CI never pulls or starts it. `make up` enables the
  # profile, so a developer gets it with the rest of the stack.
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["tools"]
    environment:
      # The pgAdmin login. Both are local development defaults; set
      # PGADMIN_EMAIL and PGADMIN_PASSWORD in .env to change them.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      # The database password is read from the environment when the
      # connection is made, so it is never typed into the UI and never
      # written to a file in the repository.
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
      SPN_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/browser/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      # The local way in, for the end to end suite. It mints a session
      # without the identity provider, and the application refuses it
      # in production. It is off by default, so the application signs
      # people in through the real identity provider, and the end to
      # end job turns it on.
      SPN_DEV_AUTH: ${SPN_DEV_AUTH:-false}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file: .env
    command: python -m app.jobs.scheduler
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/spn-worker-heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
      # The publishable key is public: it is in the front end bundle
      # either way. It is named here rather than the whole .env, so the
      # back end's secrets are not handed to the front end container.
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      # The local way in, for the end to end suite. It is off by
      # default, so the application signs people in through the real
      # identity provider, and the end to end job turns it on.
      VITE_SPN_DEV_AUTH: ${VITE_SPN_DEV_AUTH:-false}
      # The map key is public: it is in the bundle either way. It is
      # named here so the back end's secrets are not handed to the
      # front end container.
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
