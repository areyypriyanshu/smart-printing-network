[project]
name = "spn-backend"
version = "0.1.0"
description = "Smart Printing Network backend: FastAPI, SQLAlchemy, PostgreSQL with PostGIS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "geoalchemy2>=0.20.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff==0.17.1",
    "schemathesis>=3.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: pure logic, no database or network",
    "api: HTTP tests that need a running database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "pymupdf"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports only the standard library and itself"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "alembic",
    "boto3",
    "botocore",
    "fastapi",
    "psycopg",
    "pydantic",
    "sqlalchemy",
    "uvicorn",
    "app.config",
    "app.db",
    "app.errors",
    "app.gateways",
    "app.jobs",
    "app.logging",
    "app.main",
    "app.models",
    "app.routers",
    "app.schemas",
    "app.services",
]
