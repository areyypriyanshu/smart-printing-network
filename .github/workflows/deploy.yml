name: Deploy

# Deploys the image built from main to the instance.
#
# The order matters. Migrations run as a one-off container before the new
# API starts, and the migrations are written to be backward compatible with
# the previous version, so a rollback is just a redeploy of the previous
# image tag. If the smoke check fails, that redeploy happens automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/api
  TAG: ${{ github.sha }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web
  WEB_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: backend
          push: true
          # Both processors are published, because the free Oracle shape
          # (VM.Standard.A1.Flex) has an ARM processor and cannot pull an
          # amd64 only image.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The frontend is built from the same commit as the API, and it is
      # published under the same immutable name. Without this the origin
      # would run a mutable tag that no workflow builds, so the release
      # that was reviewed would not be the release the browser gets.
      - uses: docker/build-push-action@v6.18.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          # The publishable key of the identity provider. It is not a
          # secret: the browser carries it, so anybody can read it out
          # of the page. It is a repository variable, so the build does
          # not have to be told a secret to produce a bundle that the
          # browser can use.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.WEB_TAG }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Only run when a deployment target is configured. Until then the
    # images are still built and published on every merge, and the deploy
    # itself is skipped rather than failing on a machine that does not
    # exist yet. Set the repository variable DEPLOY_ENABLED to true once
    # the instance, the domain and the secrets are in place.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SPN_DOMAIN: ${{ vars.SPN_DOMAIN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The deployed code is the reviewed code. A dispatch may choose
          # any ref, so the ref is checked here rather than left to the
          # branch protection of main, and the deployment runs the same
          # commit the images were built from.
          ref: ${{ github.sha }}

      - name: Refuse to deploy anything but the reviewed branch
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "the deployment runs the reviewed code on main, not ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the configuration to the instance
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "mkdir -p '${DEPLOY_PATH}/infra/scripts'"
          scp docker-compose.prod.yml "$DEPLOY_HOST:${DEPLOY_PATH}/docker-compose.prod.yml"
          scp infra/Caddyfile "$DEPLOY_HOST:${DEPLOY_PATH}/infra/Caddyfile"
          scp infra/scripts/backup.sh "$DEPLOY_HOST:${DEPLOY_PATH}/infra/scripts/backup.sh"
          scp infra/scripts/restore-drill.sh "$DEPLOY_HOST:${DEPLOY_PATH}/infra/scripts/restore-drill.sh"

      - name: Deploy, smoke check, roll back on failure
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ env.TAG }}
          WEB_IMAGE_TAG: ${{ env.WEB_IMAGE }}:${{ env.WEB_TAG }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" env \
            DEPLOY_PATH="$DEPLOY_PATH" \
            IMAGE_TAG="$IMAGE_TAG" \
            WEB_IMAGE_TAG="$WEB_IMAGE_TAG" \
            SPN_DOMAIN="$SPN_DOMAIN" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Remember what is running now, so a rollback has a target.
          if [ -f .current-tag ]; then
            PREVIOUS_TAG="$(cat .current-tag)"
          else
            PREVIOUS_TAG=""
          fi
          echo "deploying ${IMAGE_TAG}, previous was ${PREVIOUS_TAG:-none}"

          # Both images are named by the commit they were built from, so
          # the release that was reviewed is the release that runs. A
          # mutable tag is re-resolved by name on every deploy, which is
          # how a release ends up being something other than what was
          # tested.
          export SPN_API_IMAGE="$IMAGE_TAG"
          export SPN_WEB_IMAGE="$WEB_IMAGE_TAG"
          export SPN_DOMAIN="$SPN_DOMAIN"

          # Migrations first, as a one-off container, so a schema change
          # never happens while the old API is still serving.
          #
          # The database is started first, on purpose. "docker compose
          # run" creates the services it depends on without the network
          # alias that carries the service name, so a database created
          # that way is not reachable as "db" and the API cannot find
          # it. On a first deployment, where the database does not exist
          # yet, that breaks the deploy. Starting the database the
          # ordinary way gives it the alias, and it is a no-op on every
          # deploy after that.
          docker compose -f docker-compose.prod.yml up -d db
          docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Smoke check. The service is only ready when the database and
          # the object storage are both reachable.
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${SPN_DOMAIN}/readyz" > /dev/null 2>&1; then
              echo "smoke check passed"
              echo "${IMAGE_TAG}" > .current-tag
              echo "${WEB_IMAGE_TAG}" > .current-web-tag
              exit 0
            fi
            sleep 2
          done

          echo "smoke check failed, rolling back" >&2
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "no previous version to roll back to" >&2
            exit 1
          fi
          export SPN_API_IMAGE="$PREVIOUS_TAG"
          if [ -f .current-web-tag ]; then
            export SPN_WEB_IMAGE="$(cat .current-web-tag)"
          fi
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          exit 1
          REMOTE

      - name: Check that the site answers
        run: |
          set -euo pipefail
          curl -fsS "https://${SPN_DOMAIN}/readyz"
          echo
          curl -fsS "https://${SPN_DOMAIN}/healthz"
          echo
