name: Deploy

# Deploys the image built from main to the instance.
#
# The order matters. Migrations run as a one-off container before the new
# API starts, and the migrations are written to be backward compatible with
# the previous version, so a rollback is just a redeploy of the previous
# image tag. If the smoke check fails, that redeploy happens automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/api
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Only run when a deployment target is configured. Until then the
    # images are still built and published on every merge, and the deploy
    # itself is skipped rather than failing on a machine that does not
    # exist yet. Set the repository variable DEPLOY_ENABLED to true once
    # the instance, the domain and the secrets are in place.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SPN_DOMAIN: ${{ vars.SPN_DOMAIN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the configuration to the instance
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "mkdir -p '${DEPLOY_PATH}/infra/scripts'"
          scp docker-compose.prod.yml "$DEPLOY_HOST:${DEPLOY_PATH}/docker-compose.prod.yml"
          scp infra/Caddyfile "$DEPLOY_HOST:${DEPLOY_PATH}/infra/Caddyfile"
          scp infra/scripts/backup.sh "$DEPLOY_HOST:${DEPLOY_PATH}/infra/scripts/backup.sh"
          scp infra/scripts/restore-drill.sh "$DEPLOY_HOST:${DEPLOY_PATH}/infra/scripts/restore-drill.sh"

      - name: Deploy, smoke check, roll back on failure
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" env \
            DEPLOY_PATH="$DEPLOY_PATH" \
            IMAGE_TAG="$IMAGE_TAG" \
            SPN_DOMAIN="$SPN_DOMAIN" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Remember what is running now, so a rollback has a target.
          if [ -f .current-tag ]; then
            PREVIOUS_TAG="$(cat .current-tag)"
          else
            PREVIOUS_TAG=""
          fi
          echo "deploying ${IMAGE_TAG}, previous was ${PREVIOUS_TAG:-none}"

          export SPN_API_IMAGE="$IMAGE_TAG"
          export SPN_DOMAIN="$SPN_DOMAIN"

          # Migrations first, as a one-off container, so a schema change
          # never happens while the old API is still serving.
          docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Smoke check. The service is only ready when the database and
          # the object storage are both reachable.
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${SPN_DOMAIN}/readyz" > /dev/null 2>&1; then
              echo "smoke check passed"
              echo "${IMAGE_TAG}" > .current-tag
              exit 0
            fi
            sleep 2
          done

          echo "smoke check failed, rolling back" >&2
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "no previous version to roll back to" >&2
            exit 1
          fi
          export SPN_API_IMAGE="$PREVIOUS_TAG"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          exit 1
          REMOTE

      - name: Check that the site answers
        run: |
          set -euo pipefail
          curl -fsS "https://${SPN_DOMAIN}/readyz"
          echo
          curl -fsS "https://${SPN_DOMAIN}/healthz"
          echo
