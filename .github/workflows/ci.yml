name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: spn
          POSTGRES_PASSWORD: spn
          POSTGRES_DB: spn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spn -d spn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://spn:spn@localhost:5432/spn
      # The identity provider. The test suite never reaches it: the
      # tests use the local verifier and the local reader. These values
      # are here because a deployment that has not been configured for
      # the provider cannot start, and that is true in continuous
      # integration too.
      CLERK_FAPI_URL: https://placeholder.clerk.accounts.dev
      CLERK_ALLOWED_ORIGINS: http://localhost:5173
      CLERK_SECRET_KEY: ci-placeholder-not-a-real-secret-0123456789
      CLERK_WEBHOOK_SIGNING_SECRET: ci-placeholder-webhook-secret-0123456789
      # The local way in, which mints a session without the identity
      # provider. The fuzzer needs a token and cannot reach the
      # provider. The setting is refused in production, so it is here
      # rather than being a way to weaken a deployment.
      SPN_DEV_AUTH: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Dependency audit
        working-directory: backend
        run: uv run pip-audit
      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run mypy app
      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports
      - name: Unit tests
        working-directory: backend
        run: uv run pytest tests/unit --cov=app --cov-report=term-missing
      - name: Migration up, down, up
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: API tests
        working-directory: backend
        run: uv run pytest tests/api --cov=app --cov-append --cov-report=term-missing
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=spn \
            -e MINIO_ROOT_PASSWORD=spn-local-secret \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          exit 1
      - name: Integration and job tests
        working-directory: backend
        env:
          SPN_REQUIRE_S3: "1"
        run: uv run pytest tests/integration tests/jobs --cov=app --cov-append --cov-report=term-missing
      - name: Coverage floors
        working-directory: backend
        run: uv run python scripts/check_coverage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Lint and format
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle size
        run: node scripts/check-bundle-size.mjs

  contract:
    # Fuzzes the API from its own OpenAPI schema. It finds the cases a
    # hand written test never thinks of, such as a body that is valid
    # against the schema but that the server refuses.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: spn
          POSTGRES_PASSWORD: spn
          POSTGRES_DB: spn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spn -d spn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://spn:spn@localhost:5432/spn
      # The identity provider. The test suite never reaches it: the
      # tests use the local verifier and the local reader. These values
      # are here because a deployment that has not been configured for
      # the provider cannot start, and that is true in continuous
      # integration too.
      CLERK_FAPI_URL: https://placeholder.clerk.accounts.dev
      CLERK_ALLOWED_ORIGINS: http://localhost:5173
      CLERK_SECRET_KEY: ci-placeholder-not-a-real-secret-0123456789
      CLERK_WEBHOOK_SIGNING_SECRET: ci-placeholder-webhook-secret-0123456789
      # The local way in, which mints a session without the identity
      # provider. The fuzzer needs a token and cannot reach the
      # provider. The setting is refused in production, so it is here
      # rather than being a way to weaken a deployment.
      SPN_DEV_AUTH: "true"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: spn-files
      S3_ACCESS_KEY: spn
      S3_SECRET_KEY: spn-local-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=spn \
            -e MINIO_ROOT_PASSWORD=spn-local-secret \
            coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          exit 1
      - name: Prepare the database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The API did not start" >&2
          exit 1
      - name: Get a token for the authenticated endpoints
        working-directory: backend
        run: |
          curl -s -X POST http://127.0.0.1:8000/api/v1/auth/dev-session \
            -H 'Content-Type: application/json' \
            -d '{"email":"fuzzer@example.com"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' > token.txt
      - name: Fuzz the API against its own schema
        working-directory: backend
        run: |
          # The upload endpoint is left out of the contract run on purpose.
          # Whether a file is acceptable is decided by its bytes, not by
          # its shape, and a schema cannot say "these bytes have to be a
          # PDF". The fuzzer therefore sends a body that matches the
          # schema and is rightly refused with 400 FILE_NOT_PDF, which the
          # "schema-valid request rejected" check reads as a failure. The
          # behaviour is covered by the API tests instead, one for each
          # way a file can be wrong.
          #
          # The cursors are the same kind of problem and are handled in
          # schemathesis.toml, one operation at a time.
          set -o pipefail
          uv run schemathesis --config-file schemathesis.toml run \
            http://127.0.0.1:8000/openapi.json \
            --phases examples,fuzzing \
            --max-time 120 \
            --workers 4 \
            --rate-limit 40/m \
            --exclude-path "/api/v1/uploads" \
            --header "Authorization: Bearer $(cat token.txt)" 2>&1 | tee fuzz.log

      # The fuzzer's own report is long, and the part that matters is
      # at the end of it. The lines below are turned into annotations,
      # so the failure is readable from the pull request without asking
      # for the whole log.
      - name: Say what the fuzzer found
        if: failure()
        working-directory: backend
        run: |
          {
            echo "::group::the fuzzer's report"
            tail -n 80 fuzz.log || true
            echo "::endgroup::"
            echo "::error title=The fuzzer's report::$(sed -n '/^Failures:/,/^Warnings:/p' fuzz.log | tr '\n' ' ' | cut -c1-1500)"
            echo "::error title=the fuzzer's exit::the run ended with $(tail -n 3 fuzz.log | tr '\n' ' ')"
          }

  e2e:
    # Runs the Playwright journeys and the accessibility checks against the
    # whole stack, the way a person would use it.
    runs-on: ubuntu-latest
    env:
      # The end to end suite signs in through the local way in, because it
      # has to run offline and the same way every time. The route behind
      # it is refused in production, so the suite cannot be run against a
      # deployment that matters.
      SPN_DEV_AUTH: "true"
      VITE_SPN_DEV_AUTH: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for the app
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null && curl -sf http://localhost:8000/readyz > /dev/null; then
              echo "the stack is up"
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          echo "the stack did not come up" >&2
          exit 1
      - name: Prepare the database
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api python -m app.cli seed
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - name: Run the end to end tests
        working-directory: e2e
        run: |
          set -o pipefail
          npm test 2>&1 | tee playwright.log
      - name: Say what the end to end tests found
        if: failure()
        working-directory: e2e
        run: |
          {
            echo "::error title=The end to end tests::$(grep -E '✘|✓|Error:|expect\(' playwright.log | head -n 25 | tr '\n' ' ' | cut -c1-1500)"
            echo "::error title=The failing test::$(grep -E '^  [0-9]+\) ' playwright.log | head -n 5 | tr '\n' ' ')"
          }
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  openapi:
    runs-on: ubuntu-latest
    env:
      # The identity provider. Exporting the schema builds the
      # application, and the application refuses to start without the
      # provider's settings, because there is one way to sign in. These
      # values are placeholders and the export never reaches the
      # provider.
      CLERK_FAPI_URL: https://placeholder.clerk.accounts.dev
      CLERK_ALLOWED_ORIGINS: http://localhost:5173
      CLERK_SECRET_KEY: ci-placeholder-not-a-real-secret-0123456789
      CLERK_WEBHOOK_SIGNING_SECRET: ci-placeholder-webhook-secret-0123456789
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Regenerate types and check for drift
        run: |
          cd backend && uv run python scripts/export_openapi.py
          cd ../frontend && npm ci && npx openapi-typescript ../backend/openapi.json -o src/api/schema.d.ts
          cd .. && git status --porcelain frontend/src/api/schema.d.ts
          git diff --exit-code frontend/src/api/schema.d.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --verbose
