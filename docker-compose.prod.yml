# Production stack.
#
# One origin, one TLS terminator, no CORS. The API and the built frontend
# are both served by Caddy, so the browser only ever talks to one host and
# the refresh cookie stays first party.
#
# For a local run of this file:
#   SPN_DOMAIN=localhost SPN_TLS=internal docker compose -f docker-compose.prod.yml up -d
# Caddy will then issue a certificate from its own local authority. The
# browser will warn once until that root certificate is trusted:
#   docker compose -f docker-compose.prod.yml exec caddy wget -qO- http://localhost:2019/pki/ca/cert.crt
#
# For a real deployment set SPN_DOMAIN to the domain and leave SPN_TLS
# empty so Caddy uses ACME.

name: spn-prod

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPN_DOMAIN: ${SPN_DOMAIN:-localhost}
      SPN_TLS: ${SPN_TLS:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
    image: ${SPN_API_IMAGE:-ghcr.io/areyypriyanshu/smart-printing-network/api:latest}
    restart: unless-stopped
    env_file: .env
    # --proxy-headers makes uvicorn trust the X-Forwarded-For that Caddy
    # sets. Without it the rate limiter sees the proxy address for every
    # request and one busy client can lock everyone else out.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    image: ${SPN_API_IMAGE:-ghcr.io/areyypriyanshu/smart-printing-network/api:latest}
    restart: unless-stopped
    env_file: .env
    command: python -m app.jobs.scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/spn-worker-heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.6
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spn} -d ${POSTGRES_DB:-spn}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local object storage. In production set S3_ENDPOINT_URL to empty in
  # .env and point S3_BUCKET at a real private S3 bucket instead.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MC_HOST_local: http://${S3_ACCESS_KEY:-spn}:${S3_SECRET_KEY}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
