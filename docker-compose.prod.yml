# Production stack.
#
# One origin, one TLS terminator, no CORS. The API and the built frontend
# are both served by Caddy, so the browser only ever talks to one host and
# the refresh cookie stays first party.
#
# For a local run of this file:
#   SPN_DOMAIN=localhost SPN_TLS=internal docker compose -f docker-compose.prod.yml up -d
# Caddy will then issue a certificate from its own local authority. The
# browser will warn once until that root certificate is trusted:
#   docker compose -f docker-compose.prod.yml exec caddy wget -qO- http://localhost:2019/pki/ca/cert.crt
#
# For a real deployment set SPN_DOMAIN to the domain and SPN_TLS to the
# ACME account address, which is what ACME_EMAIL is, so Caddy uses ACME.
# SPN_TLS cannot be empty: the Caddyfile turns it into a "tls" directive,
# and "tls" with no argument is a Caddyfile parse error.

name: ${SPN_COMPOSE_PROJECT:-spn-prod}

services:
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # The publishable key is public and is baked into the bundle, so
        # it is a build argument rather than a run time one.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    image: ${SPN_WEB_IMAGE:-ghcr.io/areyypriyanshu/smart-printing-network/web:latest}
    restart: unless-stopped
    ports:
      # The host ports are configurable because this stack is not always
      # deployed on a VPS with a public address. A deployment behind a
      # tunnel binds them to the loopback and the tunnel forwards to
      # them, and a host that already has something on port 80 needs a
      # different pair. The defaults are the public ones.
      - "${SPN_HTTP_PORT:-80}:80"
      - "${SPN_HTTPS_PORT:-443}:443"
    environment:
      SPN_DOMAIN: ${SPN_DOMAIN:-localhost}
      SPN_TLS: ${SPN_TLS:-internal}
      # The networks whose forwarded headers Caddy believes. Empty on a
      # VPS, where the browser is the only client. A deployment behind a
      # tunnel sets it to the tunnel's network, or the API would see the
      # tunnel's address for every request and the rate limiter would
      # count every visitor as one client.
      SPN_TRUSTED_PROXIES: ${SPN_TRUSTED_PROXIES:-}
      # Caddy needs a value for the ACME account address even when it never
      # talks to ACME, which is the case for a local run.
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # The identity provider's host, for the content security policy.
      # The browser loads the provider's script and talks to it from the
      # page, so the policy has to allow it. There is no default: a
      # policy that allows the wrong host is a policy that does not mean
      # anything.
      CLERK_FAPI_URL: ${CLERK_FAPI_URL:?set CLERK_FAPI_URL in the instance's .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ${SPN_API_IMAGE:-ghcr.io/areyypriyanshu/smart-printing-network/api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # The production topology pins the application's mode. Every
      # production-only check - the placeholder JWT secret, the test payment
      # route, the Secure refresh cookie, the fake payment provider - is
      # keyed on ENV, so it must not be left to an untracked file. A Compose
      # "environment" entry overrides "env_file".
      ENV: production
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?set PAYMENT_PROVIDER in the instance's .env}
      # The identity provider. These are the instance's own settings and
      # they are pinned here so that a deployment cannot start with the
      # wrong ones: the key set is fetched from the host, and the tokens
      # are checked against the origins listed.
      CLERK_FAPI_URL: ${CLERK_FAPI_URL:?set CLERK_FAPI_URL in the instance's .env}
      CLERK_ALLOWED_ORIGINS: ${CLERK_ALLOWED_ORIGINS:?set CLERK_ALLOWED_ORIGINS in the instance's .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in the instance's .env}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET in the instance's .env}
      # The testing surface has no business in production, whatever the
      # instance's .env says.
      TESTING_ENDPOINTS_ENABLED: "false"
      # The local bypass mints a session without the identity provider,
      # so a deployment with it on would accept a session that was never
      # proved. It is off here whatever the instance's .env says, and the
      # application refuses it in production as well.
      SPN_DEV_AUTH: "false"
    # --proxy-headers makes uvicorn read the X-Forwarded-For that Caddy
    # sets. Without it the rate limiter sees the proxy address for every
    # request and one busy client can lock everyone else out. The peer is
    # the Caddy container and nothing else, so the forwarded chain is only
    # believed when it comes from there: "*" would let any client choose
    # the address the rate limiter keys on.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=${SPN_PROXY_IPS:-172.16.0.0/12}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ${SPN_API_IMAGE:-ghcr.io/areyypriyanshu/smart-printing-network/api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # The worker runs the same code as the API, so it is in the same mode.
      ENV: production
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?set PAYMENT_PROVIDER in the instance's .env}
      # The identity provider. These are the instance's own settings and
      # they are pinned here so that a deployment cannot start with the
      # wrong ones: the key set is fetched from the host, and the tokens
      # are checked against the origins listed.
      CLERK_FAPI_URL: ${CLERK_FAPI_URL:?set CLERK_FAPI_URL in the instance's .env}
      CLERK_ALLOWED_ORIGINS: ${CLERK_ALLOWED_ORIGINS:?set CLERK_ALLOWED_ORIGINS in the instance's .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in the instance's .env}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET in the instance's .env}
      TESTING_ENDPOINTS_ENABLED: "false"
      SPN_DEV_AUTH: "false"
    command: python -m app.jobs.scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/spn-worker-heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  db:
    # The image and the platform come from the environment, because the
    # official PostGIS image is published for amd64 only and the free
    # Oracle shape (VM.Standard.A1.Flex) has an ARM processor. A
    # deployment on ARM sets SPN_DB_IMAGE to a multi-arch PostGIS image
    # and SPN_DB_PLATFORM to linux/arm64. The default is unchanged, so
    # every other deployment keeps the image it had.
    image: ${SPN_DB_IMAGE:-postgis/postgis:16-3.6}
    platform: ${SPN_DB_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spn} -d ${POSTGRES_DB:-spn}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local object storage. A deployment that keeps this MinIO leaves
  # S3_ENDPOINT_URL at http://minio:9000 in .env. A deployment that uses
  # a real private S3 bucket sets S3_ENDPOINT_URL to that bucket's
  # endpoint. It must not be empty: boto3 rejects an empty endpoint and
  # the application then refuses to start.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-spn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MC_HOST_local: http://${S3_ACCESS_KEY:-spn}:${S3_SECRET_KEY}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
